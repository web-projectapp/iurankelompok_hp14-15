<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background aman untuk Maskable Icon (Menjamin area tengah 80% tidak terpotong) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base background (bisa dipotong aman oleh sistem operasi) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Konten Utama di dalam Safe Zone (Pusat) -->
  <g filter="url(#dropShadow)">
    <!-- Simbol Koin Emas (Finansial / Iuran) -->
    <circle cx="256" cy="270" r="110" fill="url(#goldGrad)" />
    <circle cx="256" cy="270" r="85" fill="none" stroke="#fef08a" stroke-width="6" stroke-dasharray="16 8" />
    
    <!-- Tunas Daun Hijau (Pertanian / Kelompok Tani) yang tumbuh dari koin -->
    <path d="M256,120 C280,170 310,210 310,260 C310,300 285,320 256,320 C227,320 202,300 202,260 C202,210 232,170 256,120 Z" fill="url(#leafGrad)" />
    <!-- Detail urat daun tengah -->
    <path d="M256,135 L256,310" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" />
    <path d="M256,200 Q280,185 290,170" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" />
    <path d="M256,240 Q230,225 220,210" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
