<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
    <title>Iuran Kelompok Tani</title> 

    <!-- PWA Requirements (Sekarang sudah di dalam tag Head) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Buku Kas">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Biar ga ada scrollbar */
            background-color: #0d1117; /* Warna background gelap biar pas loading ga silau */
        }
        iframe {
            border: none;
            width: 100vw;
            height: 100dvh; /* Diubah ke dvh agar akurat untuk HP Android (Vivo/Samsung) */
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/macros/s/AKfycbzQ_ETD6EAn8amhIEl2EF5gCh-DJAsy8ShlGyxdb7MTkIcCaRfyUFLl6eNrbEy_O1GR/exec"></iframe>
    
    <script>
        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('PWA Ready!');
                });
            });
        }
    </script>
</body>
</html>
